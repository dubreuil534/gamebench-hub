[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gamebench-hub"
version = "0.1.0"
description = "Catalog, install, launch, and measure official standalone game benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Dominic Dubreuil" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
gamebench = "gamebench_hub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gamebench_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["work"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
